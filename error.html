<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>操作提示</title>
  <style>
    /* 背景图 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft YaHei", sans-serif;
    }
    body {
      background: url('images/0a3cd9da2ad50a5d94cff0c6f0ca4eee_720.jpg') no-repeat center center fixed;
      background-size: cover; 
      min-height: 100vh;
    }
    /* 顶部提示文字样式 */
    .top-text {
      text-align: center;
      padding-top: 40px; /* 顶部间距 */
      font-size: 24px;
      color: #2c5f2d; 
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(255,255,255,0.8); 
    }
  </style>
</head>
<body>
  <!-- 顶部提示文字 -->
  <div class="top-text">出错啦，不要连续点击哦，请点击网页左上角返回</div>
</body>
</html>
